name: Homebrew

# 从本仓库已发布的 GitHub Release 拉取 SHA256SUMS.txt，
# 使用 scripts/update-homebrew-tap.sh 同步 Casks/godwit.rb 与 README.md 到 jhzhang09/homebrew-tap。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "已发布的 Release 标签（如 v1.39.4-smime.1）"
        required: true
        type: string

permissions:
  contents: read

jobs:
  tap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download SHA256SUMS and update Homebrew tap
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "SHA256SUMS.txt" --dir release-assets
          scripts/update-homebrew-tap.sh "$TAG" release-assets/SHA256SUMS.txt
