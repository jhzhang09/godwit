name: Release

# Fork 发版工作流（无公证 / ad-hoc 签名 + 自己的软件内自动更新）：
# 1. 推送 v* 标签自动构建三端安装包及签名更新包，发布到本仓库 GitHub Releases；
# 2. 也可在 GitHub Actions 页面手动触发并指定版本号；
# 3. 客户端自动检查本仓库 Latest Release 的 update-<platform>.json 完成软件内升级。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "发布版本号或标签（如 1.39.3-smime.1 或 v1.39.4）"
        required: true
        type: string
      draft:
        description: "创建为草稿 Release"
        required: false
        type: boolean
        default: false
      prerelease:
        description: "标记为预发布（勾选后不会成为 Latest，软件内自动更新默认不会推送）"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      draft: ${{ steps.meta.outputs.draft }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - id: meta
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DRAFT: ${{ inputs.draft }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "push" ]]; then
            raw="$REF_NAME"
          else
            raw="$(printf '%s' "$INPUT_VERSION" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          fi

          version="${raw#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::无效版本号 '$raw'，请使用类似 1.39.4 或 1.39.3-smime.1 的格式"
            exit 1
          fi

          tag="v${version}"
          prerelease="false"
          if [[ "$INPUT_PRERELEASE" == "true" ]]; then
            prerelease="true"
          fi
          draft="false"
          if [[ "$INPUT_DRAFT" == "true" ]]; then
            draft="true"
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "draft=$draft" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Prepared release: tag=$tag version=$version draft=$draft prerelease=$prerelease"

  build:
    needs: prepare
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest, platform: "darwin/arm64,darwin/amd64", artifact: release-macos }
          - { name: Windows, os: windows-latest, platform: "windows/amd64,windows/arm64", artifact: release-windows }
          - { name: Linux, os: ubuntu-latest, platform: "linux/amd64,linux/arm64", artifact: release-linux }
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v5
      - run: mise run web:install
      - name: Build the system-translation bridge
        if: matrix.name == 'macOS' && hashFiles('scripts/build-system-translate.sh') != ''
        run: scripts/build-system-translate.sh
      - name: Build the Apple Intelligence helper
        if: matrix.name == 'macOS' && hashFiles('scripts/build-apple-intelligence.sh') != ''
        run: scripts/build-apple-intelligence.sh
      - name: Build the recognition model's CoreML bridge
        if: matrix.name == 'macOS' && hashFiles('scripts/build-guard-coreml.sh') != ''
        run: scripts/build-guard-coreml.sh
      - name: Ensure changelog entry for updater notes
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          escaped_ver="${VERSION//./\\.}"
          if ! grep -Eq "^## (\[)?v?${escaped_ver}(\]| |$)" CHANGELOG.md 2>/dev/null; then
            prev_tag="$(git describe --tags --abbrev=0 --exclude="$TAG" 2>/dev/null || true)"
            if [[ -n "$prev_tag" ]]; then
              log_notes="$(git log --no-merges --pretty=format:'- %s' "${prev_tag}..HEAD" | head -n 30)"
            else
              log_notes="$(git log --no-merges --pretty=format:'- %s' -n 20)"
            fi
            if [[ -z "$log_notes" ]]; then
              log_notes="- Release ${TAG}"
            fi
            tmp="$(mktemp)"
            {
              printf '## %s\n\n%s\n\n' "$VERSION" "$log_notes"
              cat CHANGELOG.md 2>/dev/null || true
            } > "$tmp"
            mv "$tmp" CHANGELOG.md
          fi
      - name: Build packages and signed updates
        env:
          GODWIT_BUILD_VERSION: ${{ needs.prepare.outputs.version }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: go tool mygo build -platform "${{ matrix.platform }}" -skip-notarize
      - name: Collect release assets
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p release-assets
          case "${{ matrix.name }}" in
            macOS)
              files=(
                dist/darwin-*/*.dmg
                dist/darwin-*/*.tar.gz
                dist/darwin-*/*.delta
                dist/darwin-*/update-*.json
              )
              ;;
            Windows)
              files=(
                dist/windows-*/godwit-setup-*.exe
                dist/windows-*/*.tar.gz
                dist/windows-*/*.delta
                dist/windows-*/update-*.json
              )
              ;;
            Linux)
              files=(
                dist/linux-*/*.deb
                dist/linux-*/*.tar.gz
                dist/linux-*/*.delta
                dist/linux-*/update-*.json
              )
              ;;
          esac
          if (( ${#files[@]} == 0 )); then
            echo "::error::未在 dist/ 找到 ${{ matrix.name }} 发布产物"
            find dist -maxdepth 3 -ls || true
            exit 1
          fi
          cp "${files[@]}" release-assets/
          ls -la release-assets/
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: release-assets/*
          if-no-files-found: error

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          DRAFT: ${{ needs.prepare.outputs.draft }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"
            exit 0
          fi

          notes=$(cat <<'EOF'
          ### 安装与更新说明（无公证 / 自签名构建）
          - **macOS**：首次下载 `.dmg` 安装后如提示“已损坏”或无法验证开发者，请在终端执行：
            ```sh
            xattr -dr com.apple.quarantine /Applications/Godwit.app
            ```
            首次安装完成后，后续可通过软件内“检查更新”自动升级。
          - **Windows**：如触发 SmartScreen 未知发布者提示，点击“更多信息 → 仍要运行”即可安装。
          - **Linux**：直接安装 `.deb` 或解压 `.tar.gz` 使用。
          EOF
          )

          args=(
            release create "$TAG" release-assets/*
            --repo "$GITHUB_REPOSITORY"
            --target "$GITHUB_SHA"
            --title "$TAG"
            --notes "$notes"
            --generate-notes
          )
          if [[ "$DRAFT" == "true" ]]; then
            args+=(--draft)
          fi
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh "${args[@]}"
